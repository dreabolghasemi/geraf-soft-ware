<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  
  <!-- Background with rounded industrial corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="94" fill="none" stroke="#334155" stroke-width="4" opacity="0.6"/>

  <!-- Telemetry / Radio Signal Arcs -->
  <path d="M 176 180 A 110 110 0 0 1 336 180" fill="none" stroke="url(#blueGrad)" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
  <path d="M 136 140 A 160 160 0 0 1 376 140" fill="none" stroke="url(#blueGrad)" stroke-width="14" stroke-linecap="round" opacity="0.6"/>
  <path d="M 96 100 A 210 210 0 0 1 416 100" fill="none" stroke="url(#blueGrad)" stroke-width="14" stroke-linecap="round" opacity="0.3"/>

  <!-- Industrial Gear in Center -->
  <g transform="translate(256, 290)">
    <!-- Gear Teeth -->
    <path d="M -22 -118 L 22 -118 L 30 -85 L 60 -75 L 88 -100 L 118 -70 L 98 -38 L 110 -8 L 140 0 L 140 40 L 110 48 L 98 78 L 118 110 L 88 140 L 58 118 L 28 128 L 20 160 L -20 160 L -28 128 L -58 118 L -88 140 L -118 110 L -98 78 L -110 48 L -140 40 L -140 0 L -110 -8 L -98 -38 L -118 -70 L -88 -100 L -60 -75 L -30 -85 Z" fill="url(#amberGrad)" />
    <!-- Gear Inner Core -->
    <circle cx="0" cy="20" r="62" fill="#0f172a" stroke="#fbbf24" stroke-width="8"/>
    
    <!-- Telemetry Mast / Tower in Core -->
    <path d="M 0 -35 L 0 55 M -24 50 L 0 -15 L 24 50 M -18 20 L 18 20 M -10 -5 L 10 -5" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="-35" r="8" fill="#fbbf24"/>
  </g>

  <!-- Status indicators / Nodes -->
  <circle cx="120" cy="380" r="14" fill="#10b981"/>
  <circle cx="392" cy="380" r="14" fill="#38bdf8"/>
  <circle cx="256" cy="445" r="10" fill="#f59e0b"/>
</svg>
